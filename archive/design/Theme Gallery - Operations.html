<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Theme Gallery · Operations</title>
<link rel="stylesheet" href="styles/signal.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; }
  .ab-frame { width:100%; height:100%; border:0; display:block; background:#fff; }
  .note-h { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; color:#241c22; }
  .note-p { font-size:12.5px; color:#5a5158; line-height:1.5; margin-top:5px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
const W = 1480, H = 1024;

const THEMES = [
  { id:'daybreak',  label:'Daybreak · soft pastel (lilac · periwinkle · peach)',   src:'themes/Ops - Daybreak.html' },
  { id:'cobalt',    label:'Cobalt · vivid cool (electric blue · coral)',           src:'themes/Ops - Cobalt.html' },
  { id:'conifer',   label:'Conifer · warm natural (pine green · brass)',           src:'themes/Ops - Conifer.html' },
  { id:'eclipse',   label:'Eclipse · dark (charcoal · blue · teal)',               src:'themes/Ops - Eclipse.html' },
  { id:'tidewater', label:'Tidewater · muted cool (teal-slate · clay)',            src:'themes/Ops - Tidewater.html' },
  { id:'inkwell',   label:'Inkwell · editorial mono (ink · saffron · teal)',       src:'themes/Ops - Inkwell.html' },
];

function App() {
  return (
    <DesignCanvas>
      <DCSection id="themes" title="Operations · Theme Gallery" subtitle="Six selectable themes on the same Signal dashboard — identical structure, density, and type; color only. Each keeps strong text contrast + intact semantics (success / warning / error / live) and is built to invert for dark mode later. Open any one fullscreen to compare.">
        <DCPostIt>
          <div className="note-h">How to read these</div>
          <div className="note-p">They span on purpose — pastel, vivid, natural, dark, muted, editorial. Pick a default and tell me which to keep as themes. I can also tweak any single palette (shift a hue, calm an accent) once you’ve narrowed it.</div>
        </DCPostIt>
        {THEMES.map(t => (
          <DCArtboard key={t.id} id={t.id} label={t.label} width={W} height={H}>
            <iframe className="ab-frame" src={t.src} title={t.label}></iframe>
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
